<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#f16b2c" />
    <meta name="description" content="OneForAll — local jobs matched with verified local tradies." />
    <title>OneForAll · Local jobs, trusted tradies</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
    <script type="module">
      // Module script so Vite inlines BASE_URL — the app is served from a
      // subpath, and a root-relative '/sw.js' would 404.
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register(`${import.meta.env.BASE_URL}sw.js`);
        });
      }
    </script>
  </body>
</html>
